<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Run — Escape Thanksgiving</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #2b1a12;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  #stage {
    position: relative;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
    background: #bfe3ff;
    cursor: pointer;
  }
  #hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6px;
    text-align: center;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    letter-spacing: 1px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hint">SPACE JUMP &nbsp;·&nbsp; DOWN DUCK &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; M MUTE</div>
  </div>
  <script src="src/config.js"></script>
  <script src="src/random.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/world.js"></script>
  <script src="src/render.js"></script>
  <script src="src/shots.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
